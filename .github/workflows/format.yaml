name: format

# manual trigger only (Actions tab -> format -> Run workflow): reformatting commits straight to the branch
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # pinned: keep in sync with `ruff==` in pyproject.toml ([dependency-groups] dev, [tool.ruff] required-version).
  # Upgrade risk: newer ruff versions can change default rules and fixes, e.g. >=0.16 enables RUF100
  # (unused-noqa), which strips `# noqa` comments; check `ruff check --fix` + `ruff format` locally
  # with the new version for removed lines (e.g. roux/global_imports.py) before bumping all three pins.
  RUFF: ruff@0.15.10

jobs:
  # apply the fixes and commit them
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6.3.1

      - name: ruff
        run: |
          ## rules from [tool.ruff.lint] in pyproject.toml
          uvx $RUFF check roux --fix || true
          uvx $RUFF format roux

      - name: ruff commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '[CI bot] linting and formating (ruff)'
