name: build

on:
  push:
    branches: [ master ]
    tags-ignore: [ '**' ]
  pull_request:
  workflow_dispatch:

# cancel superseded runs of the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ## which jobs the changed files need; a job skipped by `if:` reports as passed (required checks keep working)
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      package: ${{ steps.filter.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter the changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          ## code: tests + package; package: the build check only (README.md is the PyPI long description)
          code_re='^(roux/|tests/|examples/|pyproject\.toml$|uv\.lock$|tox\.ini$|MANIFEST\.in$|\.github/workflows/build\.yml$)'
          code=true; package=true
          if [ "$EVENT" = "pull_request" ]; then base="$BASE"; else base="$BEFORE"; fi
          ## manual runs, and a base that git can't resolve (e.g. first push), run everything
          if [ "$EVENT" != "workflow_dispatch" ] && files=$(git diff --name-only "$base" HEAD 2>/dev/null); then
            echo "$files"
            code=false; package=false
            if grep -qE "$code_re" <<< "$files"; then code=true; package=true; fi
            if grep -qx 'README.md' <<< "$files"; then package=true; fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
          echo "package=$package" | tee -a "$GITHUB_OUTPUT"

  ## undefined names (F821), redefinitions (F811), names used before assignment (F823); F401 stays off (re-exports).
  ## ruff pinned like [tool.ruff] required-version in pyproject.toml; --isolated: only these rules
  lint:
    name: Lint (undefined names)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6.3.1
      - name: ruff check (F821, F811, F823)
        run: uvx ruff@0.15.10 check roux --isolated --select F821,F811,F823 --output-format=github

  test:
    name: Test (py${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12", "3.13" ]
        # python-version: [ "3.10", "3.11", "3.12", "3.13" ]  # 3.10/3.11: still supported (tox -e py310, py311)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6.3.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Verify installed packages
        run: uv pip list

      - name: Run the tests
        run: uv run tox

  package:
    name: Check package build
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6.3.1
      - name: Build sdist and wheel
        run: uv build
      - name: Validate metadata
        run: uvx twine check dist/*
